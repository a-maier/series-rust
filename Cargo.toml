[package]
name = "series"
version = "0.13.0"
authors = ["Andreas Maier <amaier@ifae.es>"]
edition = "2024"
description = "Laurent series in a single variable"
license = "GPL-3.0-or-later"
readme = "Readme.md"
keywords = ["math", "algebra"]
categories = ["science"]
repository = "https://github.com/a-maier/series-rust"

[dependencies]
derive_more = { version = "2.1.1", features = ["display", "from"] }
elsa = "1.10"
num-traits = "0.2"
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
rand_pcg = "0.3"
rug = "1.5"

[[bench]]
name = "benchmarks"
harness = false
