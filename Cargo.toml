[package]
name = "series"
version = "0.13.0"
authors = ["Andreas Maier <amaier@ifae.es>"]
edition = "2024"
description = "Laurent series in a single variable"
license = "GPL-3.0-or-later"
readme = "Readme.md"
keywords = ["math", "algebra"]
categories = ["science"]
repository = "https://github.com/a-maier/series-rust"

[dependencies]
derive_more = { version = "2.1.1", features = ["display", "is_variant", "from"] }
elsa = "1.10"
num-traits = "0.2"
paste = "1.0.15"
rug = { version = "1.5", default-features = false, optional = true, features = ["std", "num-traits"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
winnow = { version = "0.7.14", optional = true }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
rand_pcg = "0.3"
rug = "1.5"

[[bench]]
name = "benchmarks"
harness = false

[features]
default = ["parse", "rug-integer"]
parse = ["winnow"]
winnow = ["dep:winnow"]
serde = ["dep:serde", "rug?/serde"]
thiserror = []
rug-integer = ["rug/integer", "derive_more/add", "derive_more/add_assign", "derive_more/as_ref", "derive_more/mul_assign", "derive_more/debug", "derive_more/from_str", "derive_more/into", "derive_more/not"]
